name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Install Linux clipboard tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xclip

      - name: Test (Linux, under Xvfb for the clipboard round trip)
        if: runner.os == 'Linux'
        run: xvfb-run -a go test ./... -race -timeout 120s

      - name: Test (macOS/Windows)
        if: runner.os != 'Linux'
        run: go test ./... -race -timeout 120s

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          # pinned to the release I test with locally, so CI matches what I run
          version: v2.12.2
